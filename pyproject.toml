[project]
name = "mystery-shopper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GenOS Team", email = "connect@genosapp.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=2.10",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mystery-shopper = "mystery_shopper:main"
ms = "mystery_shopper.cli:app"


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]
